<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 팀 사무실</title>
<style>
  /* ---------- 토큰 ---------- */
  :root {
    --page: #d9e4e1;
    --ink: #1d2733;
    --ink-soft: #45515e;
    --wall: #33415a;
    --wall-ink: #ffffff;
    --floor-a: #eef2e8;
    --floor-b: #e2e9dc;
    --hall-a: #d3d9d0;
    --hall-b: #c9d0c6;
    --lounge-a: #f3e9da;
    --lounge-b: #ebdfcc;
    --rug: #c9d8ec;
    --sofa: #6f86b3;
    --sofa-edge: #4d6290;
    --desk: #c08a55;
    --desk-edge: #855630;
    --screen-off: #556274;
    --screen-on: #a8ecff;
    --lamp-off: #8f9aa8;
    --lamp: #ffd25a;
    --glow: rgba(255, 206, 92, .55);
    --plate: #fffdf6;
    --plate-edge: #c9c1a8;
    --bubble: #ffffff;
    --bubble-edge: #33415a;
    --panel: #f6f8f4;
    --me-bg: #33415a;
    --me-ink: #ffffff;
    --hand-bg: #fff1c7;
    --hand-edge: #b9831a;
    --ok: #17773f;
    --bad: #b42318;
    --banner-bg: #ffe1d9;
    --banner-ink: #5c1208;
    --focus: #1f5fd6;
    --d-strategy: #8a6ad6;
    --d-dev: #3c8acb;
    --d-qa: #2f9a70;
    --d-creative: #dd8536;
    --d-ops: #c25478;
    --d-guest: #8b95a4;
    --d-lounge: #b98a4e;
    --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #121821;
      --ink: #e6ecf2;
      --ink-soft: #aab6c3;
      --wall: #080d14;
      --wall-ink: #e6ecf2;
      --floor-a: #1d2531;
      --floor-b: #19202b;
      --hall-a: #141a23;
      --hall-b: #11161e;
      --lounge-a: #262420;
      --lounge-b: #211f1b;
      --rug: #26344a;
      --sofa: #43577f;
      --sofa-edge: #2c3a58;
      --desk: #7d5636;
      --desk-edge: #523720;
      --screen-off: #2b3442;
      --screen-on: #8fe3ff;
      --lamp-off: #434d5b;
      --glow: rgba(255, 196, 70, .30);
      --plate: #243040;
      --plate-edge: #3a475a;
      --bubble: #273344;
      --bubble-edge: #8fa0b5;
      --panel: #182029;
      --me-bg: #3a4d6e;
      --me-ink: #ffffff;
      --hand-bg: #3a3016;
      --hand-edge: #d9a63a;
      --ok: #3ddc84;
      --bad: #ff6b5e;
      --banner-bg: #4a1a14;
      --banner-ink: #ffdcd5;
      --focus: #8cb8ff;
      color-scheme: dark;
    }
  }

  /* ---------- 바탕 ---------- */
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.5;
    word-break: keep-all;
    overflow-wrap: anywhere;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .emoji { font-family: var(--emoji); font-style: normal; }
  [hidden] { display: none !important; }

  /* ---------- 상단 바 ---------- */
  .topbar {
    flex: none;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
    padding: 10px 16px;
    background: var(--wall); color: var(--wall-ink);
    border-bottom: 4px solid var(--desk-edge);
  }
  .topbar h1 { margin: 0; font-size: 1.25rem; font-weight: 800; letter-spacing: -.01em; }
  .topbar .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-left: auto; font-size: .95rem; }
  .conn { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #ff6b5e; box-shadow: 0 0 0 2px rgba(255,255,255,.25); }
  .conn.on .dot { background: #3ddc84; }
  .count b { font-size: 1.1rem; }
  .demo-tag { display: none; padding: 0 8px; border: 2px solid currentColor; border-radius: 4px; font-size: .85rem; font-weight: 700; }
  body.demo .demo-tag { display: inline-block; }

  /* ---------- 연결 배너 ---------- */
  .banner {
    display: none; flex: none;
    margin: 12px 16px 0; padding: 12px 16px;
    background: var(--banner-bg); color: var(--banner-ink);
    border: 3px solid var(--bad); border-radius: 6px;
    box-shadow: 4px 4px 0 var(--bad);
  }
  body.offline .banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .banner p { margin: 0; flex: 1 1 260px; }
  .banner strong { display: block; font-size: 1.1rem; line-height: 1.4; }
  .banner code { font-weight: 700; background: rgba(0,0,0,.08); padding: 0 4px; border-radius: 3px; }
  .btn {
    min-height: 44px; padding: 8px 16px; cursor: pointer;
    background: var(--wall); color: #fff; font-weight: 700;
    border: 0; border-radius: 4px; box-shadow: 0 3px 0 var(--desk-edge);
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--desk-edge); }
  @media (prefers-color-scheme: dark) { .btn { background: #e6ecf2; color: #121821; } }

  /* ---------- 탭 (좁은 화면 전용) ---------- */
  .tabs { display: none; }

  /* ---------- 레이아웃 ---------- */
  .app {
    flex: 1; min-height: 0;
    display: grid; gap: 16px;
    grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
    grid-template-rows: minmax(0, 1fr);
    padding: 16px; width: 100%; max-width: 1600px; margin: 0 auto;
  }
  .office-pane { min-width: 0; min-height: 0; overflow-y: auto; overflow-x: hidden; }

  /* ---------- v3: 나무 바닥 오픈 사무실 토큰 ---------- */
  :root {
    --wood-a: #e6b981; --wood-b: #dfae74; --wood-line: #c4935c;
    --desk-top: #f6dfb6; --desk-side: #b98752;
    --wallpaper: #f5eee2; --wall-base: #cbbca3; --frame: #ffffff; --frame-edge: #b3a792;
    --sky-a: #b9dff9; --sky-b: #ecf7ff; --bld-a: #8db5dd; --bld-b: #a9cbea; --bld-lit: #d9ecfb;
    --led-bg: #1c2430; --led: #6dfc9a;
    --glass: #8fc3de; --glass-fill: rgba(196, 232, 244, .42);
    --line-ink: #3a2a24;
    --rank: #2360c4; --rank-ink: #ffffff; --rank-jr: #ffd23f; --rank-jr-ink: #3f2c00;
    --dust: #fff8ec;
    --dada: #d93a12;
    --rug-mix: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --wood-a: #5e4835; --wood-b: #574230; --wood-line: #453324;
      --desk-top: #a07c56; --desk-side: #5f432b;
      --wallpaper: #2a303c; --wall-base: #1a1f29; --frame: #55606f; --frame-edge: #1a1f29;
      --sky-a: #16213a; --sky-b: #2b3d63; --bld-a: #0d1524; --bld-b: #121c30; --bld-lit: #ffd66b;
      --glass: #5b88a3; --glass-fill: rgba(70, 110, 135, .34);
      --rank: #2f6fd6; --rank-jr: #f2c230;
      --dust: #d9cbb8;
      --dada: #ffb08f;
      --rug-mix: #000000;
    }
  }

  .topbar .quip {
    padding: 0 10px; border-radius: 12px; rotate: -2deg;
    background: var(--rank-jr); color: var(--rank-jr-ink);
    font-size: .8125rem; font-weight: 800; line-height: 1.6; white-space: nowrap;
  }

  /* ---------- 평면도 ---------- */
  .map {
    position: relative; width: 100%; overflow: hidden;
    background: var(--wood-a);
    border: 6px solid var(--wall); border-radius: 10px;
    box-shadow: 5px 5px 0 var(--wall);
    isolation: isolate;
  }
  .map-layer { position: absolute; inset: 0; }
  .floor { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* 위쪽 벽: 창문 + 전광판 */
  .wallband {
    position: absolute; left: 0; right: 0; top: 0;
    display: flex; align-items: stretch; gap: 10px; padding: 7px 10px 9px;
    background: var(--wallpaper); border-bottom: 5px solid var(--wall-base);
    box-shadow: 0 4px 0 rgba(0, 0, 0, .10);
  }
  .win {
    flex: 1 1 0; min-width: 0; position: relative; overflow: hidden;
    background: linear-gradient(var(--sky-a), var(--sky-b));
    border: 3px solid var(--frame); border-radius: 4px;
    box-shadow: 0 0 0 1.5px var(--frame-edge);
  }
  .win svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; }
  .win::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: var(--frame); }
  .led {
    flex: 0 0 auto; min-width: 84px; display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 0 8px; background: var(--led-bg); color: var(--led);
    border: 2px solid var(--line-ink); border-radius: 4px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 800; line-height: 1.15;
    font-size: .6875rem; letter-spacing: .08em; text-shadow: 0 0 6px var(--led);
  }
  .led b { font-size: .9375rem; letter-spacing: .06em; }

  /* 부서 러그 + 라벨 */
  .rugzone {
    position: absolute; border-radius: 12px;
    background: color-mix(in srgb, color-mix(in srgb, var(--accent) 38%, var(--rug-mix)) 58%, transparent);
    border: 2px dashed color-mix(in srgb, var(--accent) 75%, transparent);
  }
  .room-label {
    position: absolute; z-index: 1;
    display: flex; align-items: center; gap: 5px;
    padding: 0 7px 0 5px; max-width: 100%;
    background: var(--wall); color: var(--wall-ink);
    font-size: .6875rem; font-weight: 800; line-height: 15px;
    border-left: 5px solid var(--accent, var(--d-guest)); border-radius: 4px 8px 8px 4px;
    white-space: nowrap; overflow: hidden;
  }
  .room-label .n { font-weight: 600; }

  /* 가구 */
  .furn { position: absolute; pointer-events: none; }
  .furn svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .mtable {
    border-radius: 50%; background: var(--desk-top); border: 2.5px solid var(--desk-side);
    box-shadow: 0 5px 0 var(--desk-side), 0 9px 0 rgba(0, 0, 0, .10);
  }
  .laptop {
    position: absolute; width: 22px; height: 13px;
    background: var(--screen-off); border: 2px solid var(--line-ink); border-radius: 3px 3px 1px 1px;
    transition: background .3s, box-shadow .3s;
  }
  .laptop::after { content: ""; position: absolute; left: -5px; right: -5px; bottom: -5px; height: 3px; background: var(--line-ink); border-radius: 2px; }
  .laptop.on { background: var(--screen-on); box-shadow: 0 0 9px 3px var(--screen-on); }

  .desk {
    position: absolute; height: 38px;
    background: var(--desk-top); border: 2px solid var(--desk-side); border-radius: 7px;
    box-shadow: 0 4px 0 var(--desk-side), 0 8px 0 rgba(0, 0, 0, .10);
  }
  .desk::before {
    content: ""; position: absolute; inset: -16px -14px -14px; border-radius: 50%;
    background: radial-gradient(closest-side, var(--glow), transparent);
    opacity: 0; transition: opacity .4s; pointer-events: none;
  }
  .desk.on::before { opacity: 1; }
  .desk .mon {
    position: absolute; left: 5px; top: -9px; width: 21px; height: 17px;
    background: var(--screen-off); border: 2.5px solid var(--line-ink); border-radius: 3px;
    transition: background .3s, box-shadow .3s;
  }
  .desk .mon::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 10px; height: 5px; margin-left: -5px; background: var(--line-ink); border-radius: 1px 1px 3px 3px; }
  .desk.on .mon { background: var(--screen-on); box-shadow: 0 0 9px 3px var(--screen-on); }
  .desk .doc { position: absolute; right: 7px; top: 4px; width: 11px; height: 14px; background: #fffdf6; border: 1.5px solid var(--desk-side); border-radius: 1px; transform: rotate(9deg); }
  .desk .mug { position: absolute; right: 24px; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 1.5px solid var(--line-ink); }
  .desk.counter .mon, .desk.counter .mug { display: none; }

  /* 유리 칸막이 라운지 */
  .loungefloor { position: absolute; background: var(--glass-fill); }
  .glass {
    position: absolute; background: linear-gradient(135deg, #ffffff 0 30%, var(--glass) 30% 100%);
    border: 1.5px solid var(--line-ink); border-radius: 3px; opacity: .92;
  }
  .rug { border-radius: 50%; background: var(--rug); opacity: .85; border: 2px dashed rgba(255, 255, 255, .6); }
  .sofa { background: var(--sofa); border-radius: 10px 10px 4px 4px; border: 2px solid var(--line-ink); box-shadow: inset 0 -6px 0 var(--sofa-edge); }
  .sofa::before, .sofa::after { content: ""; position: absolute; top: 3px; bottom: 5px; width: 9px; background: var(--sofa-edge); border-radius: 6px; }
  .sofa::before { left: 3px; } .sofa::after { right: 3px; }
  .table-low { background: var(--desk-top); border: 2px solid var(--desk-side); border-radius: 50%; box-shadow: 0 3px 0 var(--desk-side); }
  .entrance {
    position: absolute; z-index: 1; padding: 0 7px;
    font-size: .6875rem; font-weight: 800; line-height: 16px;
    background: var(--wall); color: var(--wall-ink); border-radius: 6px 6px 0 0;
  }

  /* ---------- 직원 ---------- */
  .mate {
    --accent: var(--d-guest);
    position: absolute; left: 0; top: 0;
    translate: -50% -100%;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 2px; margin: 0; cursor: pointer;
    background: none; border: 0; border-radius: 10px;
    will-change: transform;
  }
  .mate .body { position: relative; display: block; width: 50px; height: 50px; }
  .mate .body::before { content: ""; position: absolute; left: 6px; right: 6px; bottom: -2px; height: 8px; border-radius: 50%; background: rgba(0, 0, 0, .20); }
  .mate .body svg { position: relative; display: block; width: 100%; height: 100%; overflow: visible; transform-origin: 50% 95%; }
  .mate .rank {
    position: relative; display: block; margin-top: -2px; padding: 0 6px;
    font-size: .6875rem; font-weight: 800; line-height: 14px; white-space: nowrap;
    background: var(--rank); color: var(--rank-ink);
    border: 1.5px solid var(--line-ink); border-radius: 9px;
  }
  .mate .rank.jr { background: var(--rank-jr); color: var(--rank-jr-ink); }
  .mate .rank.guest { background: var(--plate); color: var(--ink); }
  .mate .tag {
    display: block; max-width: var(--tag-max, 104px); margin-top: 1px; padding: 0 6px;
    font-size: .75rem; font-weight: 800; line-height: 16px;
    background: #ffffff; color: #1d2733;
    border: 1.5px solid var(--line-ink); border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mate .multi {
    position: absolute; right: -12px; top: -2px; padding: 0 5px;
    font-size: .6875rem; font-weight: 800; line-height: 1.45;
    background: var(--wall); color: var(--wall-ink); border-radius: 8px;
  }
  .mate .bubble {
    position: absolute; left: 50%; bottom: calc(100% + 3px);
    width: max-content; max-width: var(--bub-max, 150px);
    transform: translateX(-50%);
    padding: 2px 8px; background: var(--bubble); color: var(--ink);
    border: 2px solid var(--bubble-edge); border-radius: 11px;
    font-size: .75rem; font-weight: 700; line-height: 1.35; text-align: center;
    pointer-events: none;
  }
  .mate .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -5px; width: 7px; height: 7px;
    background: var(--bubble); border-right: 2px solid var(--bubble-edge); border-bottom: 2px solid var(--bubble-edge);
    transform: translateX(-50%) rotate(45deg);
  }
  .mate .bubble span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mate .bubble.say { border-color: var(--hand-edge); background: var(--hand-bg); }
  .mate .bubble.say::after { background: var(--hand-bg); border-color: var(--hand-edge); }
  .mate .bubble.wait { color: var(--ink-soft); }
  .mate.pop .bubble { animation: pop .28s ease-out; }
  @keyframes pop { from { transform: translateX(-50%) scale(.6); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
  .mate.walking .body svg { animation: walk .4s steps(2, jump-none) infinite; }
  .mate.running .body svg { animation: run .16s linear infinite; }
  .mate.working .body svg { animation: hop 1.1s steps(2, jump-none) infinite; }
  .mate.working:nth-of-type(2n) .body svg { animation-delay: -.35s; }
  .mate.working:nth-of-type(3n) .body svg { animation-delay: -.7s; }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes walk { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-3px) rotate(5deg); } }
  @keyframes run { 0%, 100% { transform: translateY(0) rotate(-9deg) scaleY(.94); } 50% { transform: translateY(-6px) rotate(9deg) scaleY(1.04); } }
  .mate.leaving { opacity: .85; }

  .fx { position: absolute; left: 0; top: 0; z-index: 5000; font-size: 22px; line-height: 1; translate: -50% -50%; pointer-events: none; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
  .puff {
    position: absolute; left: 0; top: 0; width: 15px; height: 11px; translate: -50% -50%;
    background: var(--dust); border: 1.5px solid var(--desk-side); border-radius: 50%; pointer-events: none;
  }
  .dada {
    position: absolute; left: 0; top: 0; z-index: 5001; translate: -50% -50%; pointer-events: none;
    font-size: 1.125rem; font-weight: 900; font-style: italic; letter-spacing: -.02em; white-space: nowrap;
    color: var(--dada);
    text-shadow: -2px 0 var(--bubble), 2px 0 var(--bubble), 0 -2px var(--bubble), 0 2px var(--bubble), -1.5px -1.5px var(--bubble), 1.5px 1.5px var(--bubble), -1.5px 1.5px var(--bubble), 1.5px -1.5px var(--bubble);
  }
  /* ---------- 대화창 ---------- */
  .chat {
    position: relative; min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border: 3px solid var(--wall); border-radius: 6px;
    box-shadow: 4px 4px 0 var(--wall);
  }
  .chat-head { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 10px; background: var(--wall); color: var(--wall-ink); }
  .chat-head h2 { margin: 0 auto 0 2px; font-size: 1rem; }
  .chips { display: flex; gap: 6px; }
  .chip {
    min-height: 32px; padding: 2px 10px; cursor: pointer;
    font-size: .8125rem; font-weight: 700;
    background: transparent; color: var(--wall-ink);
    border: 2px solid rgba(255,255,255,.45); border-radius: 16px;
  }
  .chip[aria-pressed="true"] { background: var(--wall-ink); color: var(--wall); border-color: var(--wall-ink); }
  .feed { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px 12px 20px; display: flex; flex-direction: column; gap: 8px; }
  .feed .empty { margin: auto 0; padding: 24px 8px; color: var(--ink-soft); text-align: center; }
  .feed.f-talk [data-kind="tool"], .feed.f-talk [data-kind="handoff"], .feed.f-talk [data-kind="shift"] { display: none; }
  .feed.f-tools [data-kind="shift"] { display: none; }

  .msg { max-width: 88%; min-width: 0; }
  .msg time, .line time { color: var(--ink-soft); font-size: .75rem; font-variant-numeric: tabular-nums; }
  .msg.me { align-self: flex-end; text-align: right; }
  .msg.me .text { background: var(--me-bg); color: var(--me-ink); border-radius: 14px 14px 4px 14px; text-align: left; }
  .msg.bot { align-self: flex-start; display: grid; grid-template-columns: 30px minmax(0, 1fr); column-gap: 6px; }
  .msg.bot .av { grid-row: span 2; font-size: 22px; line-height: 30px; text-align: center; }
  .msg.bot .who { font-size: .8125rem; font-weight: 800; }
  .msg.bot .text { background: var(--bubble); border: 2px solid var(--bubble-edge); border-radius: 4px 14px 14px 14px; }
  .msg .text { padding: 8px 12px; white-space: pre-wrap; text-align: left; }
  .msg .text.clamp { max-height: 10.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
  .more {
    margin-top: 2px; padding: 2px 6px; min-height: 32px; cursor: pointer;
    background: none; border: 0; color: var(--focus); font-size: .875rem; font-weight: 700; text-decoration: underline;
  }
  .line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; font-size: .875rem; color: var(--ink-soft); padding: 0 4px; }
  .line .w { font-weight: 800; color: var(--ink); }

    g.door = (from, to) => (narrow
      ? { x: clamp((from.x + to.x) / 2, g.gap.a + 34, g.gap.b - 34), y: L.y + FEET }
      : { x: L.x, y: clamp((from.y + to.y) / 2, g.gap.a + 60, g.gap.b + 26) });
    g.entrance = { x: W - 34, y: g.H - 2 };
    return g;
  }

  function box(cls, x, y, w, h, text) {

  function tickClock() {
    if (!ledClock) return;
    const d = new Date(), t = pad(d.getHours()) + ':' + pad(d.getMinutes());

  function drawLounge() {

  function drawOffice() {

    [MAIN_KEY, 'orchestrator'].forEach(k => {

  // ---------- 직원 (화면 속 캐릭터) ----------
  const mates = new Map(); // key -> mate
  const lastAssigner = new Map(); // 맡은 쪽 키 -> 맡긴 쪽 키

  // mode: 'idle' 어슬렁, 'wait' 자리에서 대기, 'desk' 일하는 중, 'gone' 손님 퇴장
  function makeMate(key) {
    const person = personOf(key);
    const b = el('button', 'mate');
    b.type = 'button';
    b.style.setProperty('--accent', 'var(' + ACCENT[person.dept] + ')');
    const bubble = el('span', 'bubble');
    const bt = el('span');
    bubble.append(bt);
    bubble.hidden = true;
    const body = el('span', 'body');
    body.setAttribute('aria-hidden', 'true');
    body.append(sprite(MASCOT[person.guest ? 'guest' : key] || MASCOT.guest));
    const r = RANK[key];
    const rank = el('span', 'rank' + (person.guest ? ' guest' : r && r[2] ? ' jr' : ''), rankText(person));
    const tag = el('span', 'tag', person.name);
    const multi = el('span', 'multi');
    multi.hidden = true;
    b.append(bubble, body, rank, tag, multi);
    const m = { key, person, el: b, bubble, bt, multi, mode: 'idle', arrived: true, pos: { x: 0, y: 0 }, target: null, anim: null, startTimer: 0, say: null, sayUntil: 0, lastMove: 0, group: null, bubMax: 150 };
    b.addEventListener('click', () => openCard(m));
    matesLayer.append(b);
    mates.set(key, m);
    return m;
  }
  ROSTER.forEach(p => makeMate(p.key));
  const isSeated = m => m.mode === 'desk' || m.mode === 'wait';

  function place(m, p) {
    m.pos = { x: p.x, y: p.y };
    m.el.style.transform = 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px)';
    m.el.style.zIndex = String(100 + Math.round(p.y));
  }
  function currentPos(m) {
    if (!m.anim) return { x: m.pos.x, y: m.pos.y };
    const t = getComputedStyle(m.el).transform;
    const mm = /matrix\(([^)]+)\)/.exec(t);
    if (mm) { const v = mm[1].split(',').map(Number); return { x: v[4], y: v[5] }; }
    return { x: m.pos.x, y: m.pos.y };
  }

  // 목표(target) 기술자 → 화면 좌표
  function resolve(t) {
    if (t.kind === 'desk') { const s = G.seats.get(t.key); return { x: s.x, y: s.y }; }
    if (t.kind === 'guest') { const s = G.guestSeats[t.slot % G.guestSeats.length]; return { x: s.x + Math.floor(t.slot / G.guestSeats.length) * 10, y: s.y }; }
    if (t.kind === 'zone') {
      const z = G.zones[t.z] || G.zones.lounge;
      const dx = z.snap ? Math.round(t.fx * z.w / z.snap) * z.snap : t.fx * z.w;
      return { x: z.x + dx, y: z.y + t.fy * z.h };
    }
    return { x: G.entrance.x, y: G.entrance.y };
  }

  // 오픈 사무실이라 곧장 가되, 라운지를 드나들 때만 유리문을 지난다
  function route(from, dest) {
    return G.inLounge(from) !== G.inLounge(dest) ? [from, G.door(from, dest), dest] : [from, dest];
  }
  function pointAt(pts, seg, d) {
    for (let i = 1; i < pts.length; i++) if (d <= seg[i]) {
      const t = (d - seg[i - 1]) / ((seg[i] - seg[i - 1]) || 1);
      return { x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * t, y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * t };
    }
    return pts[pts.length - 1];
  }

  // speed: px/초, min/max: 걸리는 시간(ms) 범위. dur: 시간 고정, delay: 출발 지연, run: 우다다다 뛰기
  function walk(m, target, opt = {}) {
    m.target = target;
    if (!G || G.W === 0) return;
    const dest = resolve(target);
    const from = currentPos(m);
    if (m.anim) { m.anim.cancel(); m.anim = null; }
    clearTimeout(m.startTimer);
    m.el.classList.remove('walking', 'running');
    const arrive = () => {
      m.el.classList.remove('walking', 'running');
      m.arrived = true;
      if (opt.onArrive) opt.onArrive();
      refreshMate(m);
    };
    m.arrived = false;
    if (reduced() || opt.instant || document.hidden) {
      place(m, dest);
      arrive();
      return;
    }
    const pts = route(from, dest);
    const seg = [0];
    for (let i = 1; i < pts.length; i++) seg.push(seg[i - 1] + Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y));
    const total = seg[seg.length - 1];
    if (total < 2) { place(m, dest); arrive(); return; }
    const dur = opt.dur || clamp(total / (opt.speed || 160) * 1000, opt.min || 600, opt.max || 2000);
    const delay = opt.delay || 0;
    const frames = pts.map((p, i) => ({ transform: 'translate(' + p.x.toFixed(1) + 'px,' + p.y.toFixed(1) + 'px)', offset: seg[i] / total }));
    place(m, dest);
    m.el.style.zIndex = String(100 + Math.round(Math.max(from.y, dest.y)));
    const go = () => {
      m.el.classList.add(opt.run ? 'running' : 'walking');
      if (opt.run) [.02, .3, .58, .86].forEach(t => setTimeout(() => { const p = pointAt(pts, seg, total * t); puff(p.x, p.y - FEET + 2); }, dur * t));
    };
    if (delay) m.startTimer = setTimeout(go, delay); else go();
    refreshMate(m);
    const a = m.el.animate(frames, { duration: dur, delay, fill: 'backwards', easing: opt.run ? 'cubic-bezier(.35,0,.45,1)' : 'linear' });
    m.anim = a;
    m.lastMove = Date.now() + delay;
    a.onfinish = () => { if (m.anim !== a) return; m.anim = null; m.el.style.zIndex = String(100 + Math.round(dest.y)); arrive(); };
    return { from, dest };
  }

  // 쉬는 자리 고르기: 라운지·빈 통로 중에서 다른 사람과 겹치지 않게
  function pickIdle(m) {
    const names = Object.keys(G.zones);
    const sum = names.reduce((a, n) => a + G.zones[n].wt, 0);
    let best = null, bestD = -1;
    for (let i = 0; i < 24; i++) {
      let r = Math.random() * sum, z = names[0];
      for (const n of names) { r -= G.zones[n].wt; if (r <= 0) { z = n; break; } }
      const t = { kind: 'zone', z, fx: Math.random(), fy: Math.random() };
      const p = resolve(t);
      let d = Infinity;
      mates.forEach(o => {
        if (o === m || !o.target || isSeated(o)) return;
        const q = resolve(o.target);
        d = Math.min(d, Math.hypot((q.x - p.x) * .9, (q.y - p.y) * 1.1));
      });
      if (d > bestD) { bestD = d; best = t; }
      if (d > 96) break;
    }
    return best;
  }

  // ---------- 말풍선 ----------
  function say(m, text, ms = 2600) {
    m.say = text;
    m.sayUntil = Date.now() + ms;
    m.el.classList.remove('pop');
    void m.el.offsetWidth;
    m.el.classList.add('pop');
    refreshMate(m);
  }

  // 일하는 중: "프로젝트: 하는 일" / 자리에서 대기: "대기 중…"
  function workText(g) {
    const project = state && state.project;
    if (g.doing) return project ? project + ': ' + g.doing : g.doing;
    return '작업 중 · ' + (g.since != null ? fmtElapsed(serverNow() - g.since) : '방금');
  }
  function refreshMate(m) {
    const now = Date.now();
    let text = '', isSay = false, isWait = false;
    if (m.say && m.sayUntil > now) { text = m.say; isSay = true; }
    else {
      m.say = null;
      if (m.arrived && m.mode === 'desk' && m.group) text = workText(m.group);
      else if (m.arrived && m.mode === 'wait') { text = '대기 중…'; isWait = true; }
    }
    if (m.bt.textContent !== text) m.bt.textContent = text;
    m.bubble.hidden = !text;
    m.bubble.classList.toggle('say', isSay);
    m.bubble.classList.toggle('wait', isWait);
    const working = m.mode === 'desk' && m.arrived;
    m.el.classList.toggle('working', working);
    const n = m.group ? m.group.count : 0;
    m.multi.hidden = n < 2;
    if (n >= 2) m.multi.textContent = '×' + n;
    const dk = deskEls.get(m.key);
    if (dk) dk.classList.toggle('on', working);
    const p = m.person;
    const status = m.mode === 'desk' ? (m.arrived ? (m.group ? workText(m.group) : '작업 중') : '자리로 가는 중')
      : m.mode === 'wait' ? (m.arrived ? '자리에서 대기 중' : '자리로 가는 중')
      : m.mode === 'gone' ? '나가는 중' : '쉬는 중';
    const label = (p.fullName || p.name) + ', ' + rankText(p) + ', ' + p.role + ', ' + status + (n > 1 ? ', ' + n + '명' : '') + '. 눌러서 자세히 보기';
    if (m.el.getAttribute('aria-label') !== label) m.el.setAttribute('aria-label', label);
    if (m.el.dataset.bub !== String(m.bubMax)) { m.el.style.setProperty('--bub-max', (m.bubMax || 150) + 'px'); m.el.dataset.bub = String(m.bubMax); }
  }

  // ---------- 효과: 서류 날리기, 먼지, 우다다다 ----------
  function fly(from, to, emoji) {
    if (!G || G.W === 0 || document.hidden) return;
    const f = el('div', 'fx emoji', emoji);
    fxLayer.append(f);
    if (reduced()) {
      f.style.transform = 'translate(' + to.x + 'px,' + to.y + 'px)';
      setTimeout(() => f.remove(), 900);
      return;
    }
    const dist = Math.hypot(to.x - from.x, to.y - from.y);
    const arc = Math.max(40, dist * .35);
    const frames = [];
    for (let i = 0; i <= 16; i++) {
      const t = i / 16;
      const x = from.x + (to.x - from.x) * t;
      const y = from.y + (to.y - from.y) * t - arc * 4 * t * (1 - t);
      frames.push({ transform: 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + ((to.x >= from.x ? 1 : -1) * 360 * t * .5).toFixed(0) + 'deg) scale(' + (1 + .35 * Math.sin(Math.PI * t)).toFixed(2) + ')' });
    }
    const a = f.animate(frames, { duration: clamp(500 + dist * 1.2, 700, 1400), easing: 'ease-in-out' });
    a.onfinish = () => {
      f.style.transform = frames[frames.length - 1].transform;
      f.animate([{ opacity: 1, transform: f.style.transform }, { opacity: 0, transform: f.style.transform + ' translateY(-10px)' }], { duration: 400 }).onfinish = () => f.remove();
    };
  }
  function puff(x, y) {
    if (!G || reduced() || document.hidden) return;
    const d = el('div', 'puff');
    fxLayer.append(d);
    const at = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    d.animate([
      { transform: at + ' scale(.4)', opacity: .95 },
      { transform: at + ' translateY(-9px) scale(1.5)', opacity: 0 },
    ], { duration: 460, easing: 'ease-out' }).onfinish = () => d.remove();
  }
  function dada(x, y, delay) {
    if (!G || reduced() || document.hidden) return;
    const d = el('div', 'dada', '우다다다');
    d.style.opacity = '0';
    fxLayer.append(d);
    const at = 'translate(' + clamp(x, 44, G.W - 44).toFixed(1) + 'px,' + Math.max(G.wallH + 14, y).toFixed(1) + 'px)';
    d.animate([
      { transform: at + ' scale(.4) rotate(-10deg)', opacity: 0 },
      { transform: at + ' scale(1.15) rotate(-6deg)', opacity: 1, offset: .18 },
      { transform: at + ' translateX(3px) rotate(-3deg)', opacity: 1, offset: .4 },
      { transform: at + ' translateX(-3px) rotate(-7deg)', opacity: 1, offset: .6 },
      { transform: at + ' translateY(-12px) rotate(-5deg)', opacity: 0 },
    ], { duration: 1100, delay: delay || 0, easing: 'ease-out' }).onfinish = () => d.remove();
  }
  function deskPoint(key) {
    const m = mates.get(key);
    const s = G.seats.get(key) || (m && m.target ? resolve(m.target) : G.guestSeats[0]);
    return { x: s.x, y: s.y - STACK + 6 };
  }
  function headPoint(key) {
    const m = mates.get(key);
    if (!m) return deskPoint(key);
    const p = currentPos(m);
    return { x: p.x, y: p.y - STACK + 6 };
  }

  // ---------- 상태 정규화 ----------
  const isNum = v => typeof v === 'number' && isFinite(v);
  const str = v => (typeof v === 'string' && v ? v : null);
  function normalize(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) { warn('응답이 객체가 아니에요. 빈 상태로 처리합니다.', raw); raw = {}; }
    let now = raw.now;
    if (!isNum(now)) { warn('now 값이 숫자가 아니에요. 브라우저 시각을 씁니다.', now); now = Date.now(); }
    let main = raw.main;
    if (!main || typeof main !== 'object') { warn('main 값이 없거나 이상해요.', main); main = {}; }
    const mainOut = { busy: !!main.busy, since: isNum(main.since) ? main.since : null, doing: str(main.doing) };

    let active = raw.active;
    if (!Array.isArray(active)) { if (active !== undefined) warn('active 값이 배열이 아니에요.', active); active = []; }
    const activeOut = [];
    active.forEach(a => {
      if (!a || typeof a !== 'object' || typeof a.type !== 'string' || !a.type) { warn('active 항목에 type 문자열이 없어요. 건너뜁니다.', a); return; }
      activeOut.push({ id: a.id == null ? '' : String(a.id), type: a.type, since: isNum(a.since) ? a.since : null, doing: str(a.doing) });
    });

    let recent = raw.recent;
    if (!Array.isArray(recent)) { if (recent !== undefined) warn('recent 값이 배열이 아니에요.', recent); recent = []; }
    const recentOut = [];
    recent.forEach(r => {
      if (!r || typeof r !== 'object' || typeof r.event !== 'string') { warn('recent 항목에 event 문자열이 없어요. 건너뜁니다.', r); return; }
      const e = { t: isNum(r.t) ? r.t : null, event: r.event, id: r.id == null ? null : String(r.id), type: str(r.type), to: str(r.to), text: typeof r.text === 'string' ? r.text : null };
      e.k = r.k != null ? String(r.k) : [e.t, e.event, e.id, e.type, e.to, (e.text || '').slice(0, 40)].join('|');
      recentOut.push(e);
    });
    recentOut.sort((a, b) => (a.t || 0) - (b.t || 0)); // 안정 정렬: 같은 시각은 받은 순서 유지
    return { now, offset: now - Date.now(), project: str(raw.project), main: mainOut, active: activeOut, recent: recentOut.slice(-80) };
  }

  // ---------- 상태 반영 ----------
  let state = null;
  let booted = false;       // 첫 상태를 받았는지 (첫 상태는 애니메이션 없이 배치)
  const seen = new Set();   // 이미 처리한 이벤트 k
  const serverNow = () => Date.now() + (state ? state.offset : 0);
  const EMPTY = { main: { busy: false, since: null, doing: null }, active: [], recent: [] };

  function groupsOf(s) {
    const groups = new Map();
    if (s.main.busy) groups.set(MAIN_KEY, { count: 1, since: s.main.since, doing: s.main.doing });
    s.active.forEach(a => {
      const k = keyOf(a.type);
      const g = groups.get(k) || { count: 0, since: null, doing: null, type: a.type };
      g.count++;
      if (a.since != null && (g.since == null || a.since < g.since)) g.since = a.since;
      if (a.doing) g.doing = a.doing;
      groups.set(k, g);
    });
    return groups;
  }

  function freeGuestSlot() {
    const used = new Set();
    mates.forEach(m => { if (m.person.guest && m.mode === 'desk' && m.target && m.target.kind === 'guest') used.add(m.target.slot); });
    let i = 0; while (used.has(i)) i++;
    return i;
  }

  let rallyUntil = 0;     // 새 질문이 오면 잠깐 동안은 main.busy 와 상관없이 전원 착석
  let wasSeatAll = false;

  function reconcile(s, instant) {
    const groups = groupsOf(s);
    $('count').textContent = String((s.main.busy ? 1 : 0) + s.active.length);
    if (!G) return; // 평면도가 아직 없으면 크기가 잡힐 때 다시 부른다
    // 손님 만들기
    groups.forEach((g, k) => {
      if (k.startsWith('guest:') && (!mates.has(k) || mates.get(k).mode === 'gone')) {
        let m = mates.get(k);
        if (!m) { m = makeMate(k); place(m, resolve({ kind: 'entrance' })); }
        m.mode = 'idle';
        m.el.classList.remove('leaving');
      }
    });
    // 메인이 일하는 동안은 전원 자리에 앉는다 (일 없으면 "대기 중…")
    const seatAll = s.main.busy || Date.now() < rallyUntil;
    const rally = seatAll && !wasSeatAll && !instant;
    wasSeatAll = seatAll;
    const runs = [];
    mates.forEach((m, k) => {
      const g = groups.get(k) || null;
      m.group = g;
      const seated = isSeated(m);
      const guest = !!m.person.guest;
      if (g || (seatAll && !guest)) {
        m.mode = g ? 'desk' : 'wait';
        if (!seated) {
          const t = guest ? { kind: 'guest', slot: freeGuestSlot() } : { kind: 'desk', key: k };
          const seat = guest ? G.guestSeats[0] : G.seats.get(k);
          m.bubMax = clamp(Math.floor(seat.cellW - 6), 70, 170);
          if (rally && !guest) {
            const r = walk(m, t, { run: true, dur: rand(600, 900), delay: rand(0, 240) });
            if (r) runs.push(r);
          } else walk(m, t, { speed: 260, min: 900, max: 1800, instant });
        }
      } else if (guest) {
        if (seated) {
          m.mode = 'gone';
          m.el.classList.add('leaving');
          walk(m, { kind: 'entrance' }, { speed: 200, min: 900, max: 2400, instant, onArrive: () => { if (m.mode === 'gone') { m.el.remove(); mates.delete(k); } } });
        }
      } else if (seated) {
        // 일이 끝났다: 천천히, 엇갈리게 흩어진다
        m.mode = 'idle'; m.bubMax = 150;
        walk(m, pickIdle(m), { speed: 55, min: 1800, max: 5200, delay: instant ? 0 : rand(0, 1600), instant });
      } else if (!m.target) {
        m.bubMax = 150;
        walk(m, pickIdle(m), { instant: true });
      }
      refreshMate(m);
    });
    // 우다다다 글자: 멀리서 뛰어오는 직원 몇 명 근처에
    if (runs.length) {
      runs.sort((a, b) => Math.hypot(b.dest.x - b.from.x, b.dest.y - b.from.y) - Math.hypot(a.dest.x - a.from.x, a.dest.y - a.from.y));
      runs.slice(0, G.narrow ? 2 : 3).forEach((r, i) => dada(r.from.x + (r.dest.x - r.from.x) * .45, r.from.y + (r.dest.y - r.from.y) * .45 - STACK - 4, i * 140));
    }
    const n = new Map();
    groups.forEach((g, k) => { const d = personOf(k).dept; n.set(d, (n.get(d) || 0) + g.count); });
    deptCount.forEach((node, d) => { const t = n.get(d) ? n.get(d) + '명' : ''; if (node.textContent !== t) node.textContent = t; });
  }

  // 새 이벤트 → 사무실 연출
  let fxDelay = 0;
  function animateEvent(e) {
    const from = keyOf(e.type);
    const run = () => {
      if (!G) return;
      const m = mates.get(from);
      if (e.event === 'handoff') {
        if (!e.to) return;
        const toKey = keyOf(e.to);
        lastAssigner.set(toKey, from);
        if (m) say(m, personOf(toKey).name + ', 부탁해!');
        fly(headPoint(from), deskPoint(toKey), '📨');
      } else if (e.event === 'stop') {
        const parent = lastAssigner.get(from) || MAIN_KEY;
        if (m) say(m, '끝! ✅', 3000);
        fly(G.seats.get(from) ? deskPoint(from) : headPoint(from), deskPoint(parent), '📄');
      } else if (e.event === 'user') {
        const mm = mates.get(MAIN_KEY); if (mm) say(mm, '💬 질문 왔다!');
      } else if (e.event === 'assistant') {
        const mm = mates.get(MAIN_KEY); if (mm) say(mm, '✉️ 답장 보냄');
      } else if (e.event === 'start') {
        if (m) say(m, '출근! 🏃', 1600);
      }
    };
    // 한 번에 여러 개 오면 조금씩 간격을 두고 연출
    const d = fxDelay;
    fxDelay += 350;
    setTimeout(run, d);
    setTimeout(() => { fxDelay = Math.max(0, fxDelay - 350); }, d + 350);
  }

  function applyState(s) {
    const first = !booted;
    const fresh = s.recent.filter(e => !seen.has(e.k));
    fresh.forEach(e => seen.add(e.k));
    if (first) {
      // 과거 기록은 재생하지 않고, 맡긴 관계만 기억
      s.recent.forEach(e => { if (e.event === 'handoff' && e.to) lastAssigner.set(keyOf(e.to), keyOf(e.type)); });
    } else if (fresh.some(e => e.event === 'user')) {
      rallyUntil = Date.now() + 4000; // "다들 자리에 앉아!" → 우다다다
    }
    reconcile(s, first);
    if (!first) fresh.forEach(animateEvent);
    appendChat(fresh, first);
    booted = true;
  }

  // ---------- 어슬렁거리기 ----------
  const IDLE_LINES = ['☕', '☕ 한 잔', '💤', '🎵', '🍪', '🌿', '📱', '🥱', '😌'];
  setInterval(() => {
    if (!G || G.W === 0 || reduced() || document.hidden) return;
    const idle = [...mates.values()].filter(m => m.mode === 'idle' && m.arrived && Date.now() - m.lastMove > 4000);
    if (!idle.length) return;
    const m = idle[Math.floor(Math.random() * idle.length)];
    walk(m, pickIdle(m), {
      speed: 45, min: 1500, max: 5500,
      onArrive: () => { if (m.mode === 'idle' && Math.random() < .45) say(m, IDLE_LINES[Math.floor(Math.random() * IDLE_LINES.length)], 2200); },
    });
  }, 1300);

  // ---------- 크기 변화 ----------
  function relayout() {
    const W = Math.floor(map.clientWidth);
    if (!W) return;
    if (G && G.W === W) return;
    G = buildGeometry(W);
    drawOffice();
    mates.forEach(m => {
      if (m.anim) { m.anim.cancel(); m.anim = null; }
      clearTimeout(m.startTimer);
      m.el.classList.remove('walking', 'running');
      if (m.mode === 'gone') { m.el.remove(); mates.delete(m.key); return; }
      if (!m.target || (m.target.kind === 'zone' && !G.zones[m.target.z])) m.target = pickIdle(m);
      m.arrived = true;
      if (isSeated(m)) {
        const seat = m.target.kind === 'desk' ? G.seats.get(m.key) : G.guestSeats[0];
        m.bubMax = clamp(Math.floor(seat.cellW - 6), 70, 170);
      }
      place(m, resolve(m.target));
      refreshMate(m);
    });
    reconcile(state || EMPTY, true);
  }
  new ResizeObserver(() => relayout()).observe(map);

  // ---------- 대화창 ----------
  const feed = $('feed');
  const newBtn = $('newBtn');
  let stick = true;
  let unseen = 0;
  let lastAssistantText = null;
  const MAX_ITEMS = 400;

  function timeEl(t) {
    const tm = el('time', null, t != null ? fmtClock(t) : '');
    if (t != null) tm.dateTime = new Date(t).toISOString();
    return tm;
  }
  function longText(cls, text) {
    const wrap = document.createDocumentFragment();
    const div = el('div', 'text ' + cls, text);
    wrap.append(div);
    const lines = text.split('\n').length;
    if (text.length > 360 || lines > 7) {
      div.classList.add('clamp');
      const btn = el('button', 'more', '펼치기');
      btn.type = 'button';
      btn.setAttribute('aria-expanded', 'false');
      btn.addEventListener('click', () => {
        const open = div.classList.toggle('clamp') === false;
        btn.textContent = open ? '접기' : '펼치기';
        btn.setAttribute('aria-expanded', String(open));
      });
      wrap.append(btn);
    }
    return wrap;
  }
  function folded(summary, text) {
    const d = el('details');
    d.append(el('summary', null, summary), el('p', null, text));
    return d;
  }

  function chatItem(e) {
    const who = keyOf(e.type);
    const text = e.text || '';
    switch (e.event) {
      case 'user': {
        if (!text) return null;
        const n = el('div', 'msg me'); n.dataset.kind = 'talk';
        n.append(longText('', text), timeEl(e.t));
        return n;
      }
      case 'main_stop':
        // 서버가 마지막 답변을 main_stop 에 담아 보낼 때: 같은 답변이 이미 있으면 줄만 표시
        if (text && text !== lastAssistantText) { lastAssistantText = text; return botMsg(e, text); }
        return shift(e, '🌰 쿠리만쥬 한숨 돌림');
      case 'assistant':
        if (!text) return null;
        lastAssistantText = text;
        return botMsg(e, text);
      case 'tool': {
        const n = el('div', 'line'); n.dataset.kind = 'tool';
        n.append(el('span', 'w', whoText(who)), el('span', null, text || '도구 사용'), timeEl(e.t));
        return n;
      }
      case 'handoff': {
        const n = el('div', 'line handoff'); n.dataset.kind = 'handoff';
        n.append(el('span', 'w', whoText(who) + ' → ' + whoText(keyOf(e.to || 'general-purpose'))));
        if (text) n.append(el('span', null, text));
        n.append(timeEl(e.t));
        return n;
      }
      case 'start': return shift(e, whoText(who) + ' 출근');
      case 'stop': {
        const n = shift(e, whoText(who) + ' 퇴근');
        if (text) n.append(folded('결과 보기', text));
        return n;
      }
      case 'main_start': return shift(e, '🌰 쿠리만쥬 작업 시작');
      case 'session': { const n = el('div', 'divider', '새 세션'); n.setAttribute('role', 'separator'); return n; }
      case 'beat': return null;
      default:
        warn('알 수 없는 recent.event 값이에요.', e.event);
        return shift(e, whoText(who) + ' · ' + e.event);
    }
  }
  function botMsg(e, text) {
    const n = el('div', 'msg bot'); n.dataset.kind = 'talk';
    const av = el('span', 'av emoji', '🌰'); av.setAttribute('aria-hidden', 'true');
    const head = el('div', 'who');
    head.append(document.createTextNode('쿠리만쥬 '), timeEl(e.t));
    const body = el('div');
    body.append(longText('', text));
    n.append(av, head, body);
    return n;
  }
  function shift(e, label) {
    const n = el('div', 'line shift'); n.dataset.kind = 'shift';
    n.append(el('span', null, label), timeEl(e.t));
    return n;
  }

  function atBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 48; }
  function toBottom(smooth) {
    feed.scrollTo({ top: feed.scrollHeight, behavior: smooth && !reduced() ? 'smooth' : 'auto' });
    unseen = 0; newBtn.hidden = true;
  }
  feed.addEventListener('scroll', () => {
    stick = atBottom();
    if (stick) { unseen = 0; newBtn.hidden = true; }
  }, { passive: true });
  newBtn.addEventListener('click', () => { stick = true; toBottom(true); feed.focus({ preventScroll: true }); });

  function isVisible(n) { return n.offsetParent !== null || getComputedStyle(n).display !== 'none'; }
  function appendChat(events, initial) {
    const items = [];
    events.forEach(e => { try { const n = chatItem(e); if (n) items.push(n); } catch (err) { console.error('[office] 대화 항목 그리기 실패:', err, e); } });
    if (!items.length) return;
    $('feedEmpty').hidden = true;
    const wasStick = stick || initial;
    items.forEach(n => feed.append(n));
    while (feed.children.length > MAX_ITEMS + 1) feed.children[1].remove();
    const chatShown = isVisible($('chatPane'));
    if (wasStick) { requestAnimationFrame(() => toBottom(!initial)); }
    else {
      unseen += items.length;
      newBtn.hidden = false;
    }
    if (!initial && !chatShown) bumpUnread(items.filter(n => n.dataset.kind === 'talk').length);
  }
  function clearChat() {
    [...feed.children].forEach(n => { if (n.id !== 'feedEmpty') n.remove(); });
    $('feedEmpty').hidden = false;
    lastAssistantText = null;
    stick = true; newBtn.hidden = true; unseen = 0;
  }

  // 필터 칩
  document.querySelectorAll('.chip').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    feed.classList.toggle('f-talk', btn.dataset.f === 'talk');
    feed.classList.toggle('f-tools', btn.dataset.f === 'tools');
    stick = true; toBottom(false);
  }));

  // ---------- 모바일 탭 ----------
  const app = $('app');
  const tabs = [$('tabOffice'), $('tabChat')];
  let unread = 0;
  function bumpUnread(n) {
    if (!n || !window.matchMedia('(max-width: 760px)').matches) return;
    unread += n;
    $('unread').textContent = String(unread);
    $('unread').hidden = false;
    $('tabChat').setAttribute('aria-label', '대화, 새 메시지 ' + unread + '개');
  }
  function selectTab(chat, focus) {
    app.classList.toggle('show-chat', chat);
    tabs.forEach((t, i) => {
      const on = (i === 1) === chat;
      t.setAttribute('aria-selected', String(on));
      t.tabIndex = on ? 0 : -1;
    });
    if (chat) { unread = 0; $('unread').hidden = true; $('tabChat').removeAttribute('aria-label'); stick = true; requestAnimationFrame(() => toBottom(false)); }
    if (focus) tabs[chat ? 1 : 0].focus();
  }
  tabs[0].addEventListener('click', () => selectTab(false));
  tabs[1].addEventListener('click', () => selectTab(true));
  tabs.forEach(t => t.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); selectTab(t === tabs[0], true); }
  }));

  // ---------- 직원 카드 ----------
  const card = $('card');
  let cardFrom = null;
  function openCard(m) {
    const p = m.person;
    cardFrom = m.el;
    $('cardTitle').textContent = p.emoji + ' ' + (p.fullName ? '손님 ' + p.name : p.name);
    $('cardRole').textContent = p.dept + ' · ' + p.role + ' · ' + rankText(p);
    $('cardNow').textContent = m.mode === 'desk'
      ? '지금: ' + (m.group ? workText(m.group) : '작업 중') + (m.group && m.group.count > 1 ? ' (' + m.group.count + '명)' : '')
      : (m.mode === 'wait' ? '지금: 자리에서 대기 중' : '지금: 쉬는 중');
    const ex = $('cardEx');
    ex.textContent = '';
    if (p.ex) ex.append(el('span', null, '이렇게 불러요'), document.createTextNode(p.ex));
    else ex.append(el('span', null, '명부에 없는 에이전트'), document.createTextNode('팀 목록에 없는 agent_type 이라 손님석에 앉았어요.'));
    $('cardKey').textContent = 'agent_type: ' + (p.key === MAIN_KEY ? '메인 대화' : p.key);
    card.hidden = false;
    const r = m.el.getBoundingClientRect();
    const w = card.offsetWidth, h = card.offsetHeight;
    let left = r.left + window.scrollX + r.width / 2 - w / 2;
    left = Math.max(16 + window.scrollX, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 16));
    let top = r.bottom + window.scrollY + 6;
    if (r.bottom + h + 12 > window.innerHeight && r.top - h - 6 > 0) top = r.top + window.scrollY - h - 6;
    card.style.left = left + 'px';
    card.style.top = top + 'px';
    $('cardClose').focus();
  }
  function closeCard() {
    if (card.hidden) return;
    card.hidden = true;
    if (cardFrom && document.contains(cardFrom)) cardFrom.focus();
  }
  $('cardClose').addEventListener('click', closeCard);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });
  document.addEventListener('click', e => {
    if (!card.hidden && !card.contains(e.target) && !(cardFrom && cardFrom.contains(e.target))) closeCard();
  });

  // ---------- 연결 상태 ----------
  let connected = null;
  let lastErr = '';
  const bannerDefault = { title: $('bannerTitle').textContent, detail: $('bannerDetail').textContent };
  function setConnected(on, err) {
    const msg = on ? '' : String((err && err.message) || err || '');
    if (!on && msg !== lastErr) {
      // 서버가 켜져 있는데 오류를 돌려준 경우와 아예 안 켜진 경우를 구분해서 보여준다
      const serverError = err && err.serverError;
      $('bannerTitle').textContent = serverError ? '서버 오류 — 서버 터미널을 확인하세요' : bannerDefault.title;
      $('bannerDetail').textContent = serverError ? msg : bannerDefault.detail;
      if (on === connected) console.warn('[office] 연결 실패 원인이 바뀌었어요:', err);
    }
    lastErr = msg;
    if (on === connected) return;
    connected = on;
    document.body.classList.toggle('offline', !on);
    $('conn').classList.toggle('on', on);
    $('connText').textContent = on ? '연결됨' : '연결 안 됨';
    if (on) { if (demo) stopDemo(); console.info('[office] 서버에 연결됐어요.'); }
    else console.warn('[office] 서버 연결 실패: /state 를 받을 수 없어요.', err || '');
  }

  function resetScene() {
    booted = false;
    seen.clear();
    lastAssigner.clear();
    clearChat();
  }

  // ---------- 메시지 보내기 ----------
  const tokenMeta = document.querySelector('meta[name="office-token"]');
  const TOKEN = tokenMeta ? tokenMeta.content : null;
  const msgEl = $('msg'), sendBtn = $('sendBtn'), freshBtn = $('freshBtn'), noteEl = $('composerNote');
  let serverV = null;
  let webBusy = false, sending = false, freshNext = false, noteErr = '';
  const MODE_NOTE = { acceptEdits: '파일 수정은 자동 허용, 그 밖에 허락이 필요한 일은 터미널에서 하세요.', default: '허락이 필요한 일은 터미널에서 하세요.', plan: '계획만 세우는 모드예요.' };
  function setNote(text, isErr) { noteEl.textContent = text; noteEl.classList.toggle('err', !!isErr); }
  function updateComposer(web) {
    const usable = !!TOKEN && connected === true && !demo;
    webBusy = !!(web && web.busy);
    msgEl.disabled = !usable;
    sendBtn.disabled = !usable || webBusy || sending;
    freshBtn.disabled = !usable || webBusy || sending;
    freshBtn.setAttribute('aria-pressed', String(freshNext));
    freshBtn.textContent = freshNext ? '새 대화로 보냄 ✓' : '새 대화';
    if (!TOKEN) return setNote(location.protocol === 'file:' ? '파일로 직접 연 화면이에요. node office/launch.js 로 켠 주소에서 여세요.' : '옛 버전 서버가 켜져 있어서 입력할 수 없어요. 터미널에서 node office/launch.js 를 실행하면 새로 켜져요.', true);
    if (noteErr) return setNote(noteErr, true);
    if (!usable) return setNote(TOKEN ? '서버에 연결되면 여기서 바로 말을 걸 수 있어요.' : '', false);
    if (webBusy) return setNote('쿠리만쥬가 일하는 중… 끝나면 다음 메시지를 보낼 수 있어요.', false);
    setNote((web && MODE_NOTE[web.mode]) || (web && web.mode ? '권한 모드: ' + web.mode : ''), false);
  }
  async function sendMessage() {
    const text = msgEl.value.trim();
    if (!text || sending || webBusy || !TOKEN) return;
    sending = true; noteErr = ''; updateComposer({ busy: true });
    try {
      const res = await fetch('/send', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Office-Token': TOKEN }, body: JSON.stringify({ text, fresh: freshNext }) });
      if (!res.ok) {
        let why = 'HTTP ' + res.status;
        try { why = (await res.json()).error || why; } catch (e) { /* 본문이 JSON이 아니면 상태 코드만 보여준다 */ }
        throw new Error(why);
      }
      msgEl.value = ''; freshNext = false;
    } catch (e) {
      console.error('[office] 메시지 전송 실패:', e);
      noteErr = '전송 실패: ' + (e.message || e);
    } finally {
      sending = false; updateComposer({ busy: webBusy });
    }
  }
  $('composer').addEventListener('submit', e => { e.preventDefault(); sendMessage(); });
  msgEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
  });
  msgEl.addEventListener('input', () => { if (noteErr) { noteErr = ''; updateComposer({ busy: webBusy }); } });
  freshBtn.addEventListener('click', () => { freshNext = !freshNext; updateComposer({ busy: webBusy }); });

  async function poll() {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 2500);
      let res;
      try { res = await fetch('/state', { cache: 'no-store', signal: ctrl.signal }); }
      finally { clearTimeout(timer); }
      if (!res.ok) {
        const err = new Error('HTTP ' + res.status + ': ' + (await res.text().catch(() => '')).slice(0, 200));
        err.serverError = true;
        throw err;
      }
      let json;
      try { json = await res.json(); }
      catch (e) { warn('/state 응답이 JSON이 아니에요.', e); throw e; }
      setConnected(true);
      // 화면 코드 버그는 연결 실패로 바꾸지 않고 따로 알린다
      if (typeof json.v === 'string') {
        let triedReload = false;
        try { triedReload = sessionStorage.getItem('officeReload') === json.v; sessionStorage.setItem('officeReload', json.v); } catch (e) { triedReload = true; }
        if ((serverV && serverV !== json.v) || (!TOKEN && !triedReload)) { location.reload(); return; }
        serverV = json.v;
      }
      try { state = normalize(json); applyState(state); updateComposer(json.web); }
      catch (e) { console.error('[office] 화면 그리기 실패 (서버 문제 아님):', e); }
    } catch (e) {
      setConnected(false, e);
      updateComposer(null);
      if (!demo && state) {
        state = null;
        try { reconcile(EMPTY, false); } catch (re) { console.error('[office] 화면 그리기 실패:', re); }
      }
    } finally {
      setTimeout(poll, 1000);
    }
  }

  // ---------- 데모 모드 ----------
  // [event, 낸 쪽 type(null=메인), 맡는 쪽 type 또는 text, text]
  const SCRIPT = [
    ['session'],
    ['user', null, '사무실 페이지에 대화창도 붙여줄래? 터미널이랑 따로 보기 불편해.'],
    ['main_start'],
    ['tool', null, '📖 office/index.html 읽는 중'],
    ['assistant', null, '좋아요. 지금 구조부터 살펴볼게요.\n탐색가한테 이벤트 흐름 조사를 맡기고, 설계자랑 화면을 잡을게요.'],
    ['handoff', null, 'Explore', '이벤트가 어디서 들어오는지 조사'],
    ['start', 'Explore'],
    ['tool', 'Explore', "🔍 'recent' 찾는 중"],
    ['handoff', null, 'Plan', '대화창 붙인 화면 설계'],
    ['start', 'Plan'],
    ['tool', 'Explore', '📖 server.js 읽는 중'],
    ['tool', 'Plan', '📝 레이아웃 스케치 중'],
    ['stop', 'Explore', 'hook.js 가 이벤트를 쓰고 server.js 가 /state 로 모아 보내요.\n대화 내용은 user/assistant 이벤트로 들어와요.'],
    ['handoff', 'Plan', 'general-purpose', '설계대로 대화창 구현'],
    ['start', 'general-purpose'],
    ['stop', 'Plan', '왼쪽은 사무실, 오른쪽은 대화창. 모바일은 탭으로 바꿔 봐요.'],
    ['tool', 'general-purpose', '✏️ index.html 고치는 중'],
    ['handoff', null, 'general-purpose', '데모 모드도 같이 손보기'],
    ['start', 'general-purpose'],
    ['handoff', null, 'designer', '모바일 360px 다듬기'],
    ['start', 'designer'],
    ['tool', 'designer', '🎨 색 대비 확인 중'],
    ['start', 'claude'],
    ['tool', 'general-purpose', '💻 npm test 실행 중'],
    ['stop', 'general-purpose', '구현 끝. 테스트 12개 모두 통과.'],
    ['stop', 'claude', '참고 자료 정리했어요.'],
    ['handoff', null, 'pr-review-toolkit:code-reviewer', '바뀐 코드 리뷰'],
    ['start', 'pr-review-toolkit:code-reviewer'],
    ['handoff', null, 'pr-review-toolkit:silent-failure-hunter', '삼켜진 에러 찾기'],
    ['start', 'pr-review-toolkit:silent-failure-hunter'],
    ['stop', 'general-purpose', '데모 모드 정리 완료.'],
    ['tool', 'pr-review-toolkit:code-reviewer', '🧐 바뀐 부분 읽는 중'],
    ['stop', 'designer', '360px 에서도 가로 스크롤 없어요.'],
    ['stop', 'pr-review-toolkit:code-reviewer', '큰 문제 없음. 변수 이름 하나만 바꾸면 좋겠어요.'],
    ['stop', 'pr-review-toolkit:silent-failure-hunter', '빈 catch 없음.'],
    ['handoff', null, 'librarian', '오늘 작업 기록'],
    ['start', 'librarian'],
    ['tool', 'librarian', '📝 작업 일지 쓰는 중'],
    ['stop', 'librarian', '작업 일지에 남겼어요.'],
    ['assistant', null, '다 됐어요! 이제 페이지 하나에서 사무실과 대화를 같이 볼 수 있어요.\n직원을 누르면 역할 카드도 열려요.'],
    ['main_stop'],
  ];
  let demo = null;
  function demoStep() {
    const d = demo, now = Date.now();
    if (d.i % SCRIPT.length === 0) { d.active = []; d.main = { busy: false, since: null, doing: null }; }
    const [ev, type, a3, a4] = SCRIPT[d.i % SCRIPT.length];
    d.i++;
    const rec = { k: 'demo-' + (d.seq++), t: now, event: ev };
    const findActive = t => d.active.find(a => a.type === t);
    if (ev === 'main_start') d.main = { busy: true, since: now, doing: null };
    else if (ev === 'main_stop') d.main = { busy: false, since: null, doing: null };
    else if (ev === 'user' || ev === 'assistant') { rec.text = a3; if (ev === 'user') d.main = { busy: true, since: now, doing: '💭 생각 중' }; }
    else if (ev === 'tool') {
      rec.text = a3;
      if (type) { const a = findActive(type); if (a) { a.doing = a3; rec.id = a.id; } rec.type = type; }
      else d.main.doing = a3;
    } else if (ev === 'handoff') {
      rec.to = a3; rec.text = a4;
      if (type) { const a = findActive(type); if (a) rec.id = a.id; rec.type = type; }
      else d.main.doing = '📨 ' + personOf(keyOf(a3)).name + '에게 일 맡기는 중';
    } else if (ev === 'start') {
      const id = 'demo' + d.seq;
      d.active.push({ id, type, since: now, doing: null });
      rec.type = type; rec.id = id;
    } else if (ev === 'stop') {
      const i = d.active.findIndex(a => a.type === type);
      if (i >= 0) { rec.id = d.active[i].id; d.active.splice(i, 1); }
      rec.type = type; rec.text = a3;
    }
    d.recent.push(rec);
    if (d.recent.length > 80) d.recent.shift();
    state = normalize({ now, project: 'jj', main: d.main, active: d.active.map(a => ({ ...a })), recent: d.recent.slice() });
    applyState(state);
  }
  function startDemo() {
    if (demo) return;
    resetScene();
    demo = { i: 0, seq: 1, main: { busy: false, since: null, doing: null }, active: [], recent: [], timer: 0 };
    document.body.classList.add('demo');
    $('demoBtn').textContent = '데모 끄기';
    $('demoBtn').setAttribute('aria-pressed', 'true');
    demoStep();
    demo.timer = setInterval(demoStep, 1900);
  }
  function stopDemo() {
    if (!demo) return;
    clearInterval(demo.timer);
    demo = null;
    document.body.classList.remove('demo');
    $('demoBtn').textContent = '데모 보기';
    $('demoBtn').setAttribute('aria-pressed', 'false');
    resetScene();
    state = null;
    reconcile(EMPTY, true);
  }
  $('demoBtn').addEventListener('click', () => (demo ? stopDemo() : startDemo()));

  // ---------- 시작 ----------
  relayout();
  setInterval(() => mates.forEach(refreshMate), 1000); // 경과 시간·말풍선 만료
  poll();
})();
</script>
